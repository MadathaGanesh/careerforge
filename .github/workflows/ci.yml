name: CareerForge CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - run: mvn -B -f backend/pom.xml verify
      - run: python3 scripts/update-ai-schemas.py --check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DEV_AUTH_ENABLED: 'true'
      STRIPE_WEBHOOK_SECRET: suite-only-fixture
      CF_TEST_WEBHOOK_SECRET: suite-only-fixture
      CF_BROWSER_MATRIX: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: echo "JWT_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 180
      - run: curl --silent --fail http://localhost:5173/actuator/health >/dev/null
      - run: python -m pip install requests && python tests/integration/smoke.py
      - working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium firefox webkit && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: frontend/test-results/
          if-no-files-found: ignore
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
