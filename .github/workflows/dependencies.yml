name: Dependency review
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  advisories:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.7.1
    with:
      upload-sarif: false
      fail-on-vuln: true
      scan-args: |-
        --recursive
        ./
