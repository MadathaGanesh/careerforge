services:
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: ${DEPLOYMENT_PROFILE:-production}
      DB_URL: ${DB_URL:?Use the production PostgreSQL JDBC URL}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      APP_ORIGIN: ${APP_ORIGIN:?Set the public HTTPS origin}
      COOKIE_SECURE: 'true'
      DEV_AUTH_ENABLED: 'false'
      STORAGE_ROOT: /app/storage
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_PREFIX: ${STORAGE_PREFIX:-careerforge/}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_PATH_STYLE: ${STORAGE_PATH_STYLE:-false}
      OPERATIONS_JMX_ENABLED: ${OPERATIONS_JMX_ENABLED:-false}
      AWS_ROLE_ARN: ${AWS_ROLE_ARN:-}
      AWS_WEB_IDENTITY_TOKEN_FILE: ${AWS_WEB_IDENTITY_TOKEN_FILE:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
      MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD}
      MAIL_AUTH: 'true'
      MAIL_STARTTLS: 'true'
      MAIL_STARTTLS_REQUIRED: 'true'
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      NOTIFICATION_ZONE: ${NOTIFICATION_ZONE:-Asia/Kolkata}
      NOTIFICATION_POLL_MS: ${NOTIFICATION_POLL_MS:-60000}
      STRIPE_RECONCILE_MS: ${STRIPE_RECONCILE_MS:-3600000}
    volumes:
      - careerforge_storage:/app/storage
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        VITE_DEMO_LOGIN: 'false'
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  careerforge_storage:
